name: Deploy Frontend App to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        run: |
          npm ci || npm install --legacy-peer-deps
          npm run build
        env:
          VITE_API_URL: http://160.191.14.113:5000/api
          VITE_API_BASE_URL: http://160.191.14.113:5000/api
          VITE_SOCKET_URL: http://160.191.14.113:5000

      - name: Sync dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || '160.191.14.113' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "dist"
          target: "/var/lib/.node-services/core-engine-1/frontend"
          rm: false

      - name: Complete Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '160.191.14.113' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            chmod -R 755 /var/lib/.node-services/core-engine-1/frontend/dist
            echo "✅ Color Prediction Frontend deployed to /var/lib/.node-services/core-engine-1/frontend/dist successfully!"

